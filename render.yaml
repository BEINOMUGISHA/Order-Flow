services:
  - type: web
    name: order-flow-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/markets
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ORDERFLOW_MARKETS
        value: '[{"symbol":"BTCUSDT","provider":"simulated","asset_class":"crypto","tick_size":0.1,"initial_price":65000},{"symbol":"AAPL","provider":"simulated","asset_class":"equity","tick_size":0.01,"initial_price":200}]'